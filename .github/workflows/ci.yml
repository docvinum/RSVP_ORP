name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La bibliothèque supporte Node ≥ 20 ; la démo Angular 22 exige Node ≥ 22.22.3 / 24.15.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, tests unitaires
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build et vérification de l'artefact commité
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "::error::dist/ n'est pas à jour : exécutez npm run build et commitez." && exit 1)
      - name: Démonstrateurs (Vue, Angular)
        run: |
          npm ci --prefix examples/vue
          npm ci --prefix examples/angular
          npm run examples:build
      - run: npx playwright install --with-deps chromium
      - name: Tests E2E (desktop, mobile, intégration)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    # Les captures de référence dépendent des polices de l'environnement qui les
    # a générées : ce job signale les écarts sans bloquer (voir docs/limitations.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
