<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal RSVP Reader — démonstrateur JavaScript natif</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site">
    <strong>Démo JavaScript natif</strong>
    <nav aria-label="Navigation de la démo">
      <a href="#/articles">Articles</a>
      <a href="#/a-propos">À propos</a>
    </nav>
  </header>
  <main id="app"></main>
  <aside class="lifecycle" aria-label="Cycle de vie du lecteur">
    <h2>Cycle de vie</h2>
    <p>Lecteur : <output id="reader-status">—</output></p>
    <label><input type="checkbox" id="persist"> Persistance locale des préférences</label>
    <div class="row">
      <button type="button" id="destroy">Détruire le lecteur</button>
      <button type="button" id="recreate">Recréer le lecteur</button>
    </div>
    <h3>Événements</h3>
    <ol id="log" class="log"></ol>
  </aside>
  <script type="module" src="./app.js"></script>
</body>
</html>
